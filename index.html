<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Polly Phonics</title>
<style>
  @font-face {
    font-family: "Andika";
    src: url("fonts/Andika-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --bg: #fff8ec;
    --ink: #2b2b2b;
    --muted: #7a6f60;
    --card: #ffffff;
    --line: #ecdcc2;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --good: #3bb273;
    --blend: #7b6cd9;
    --soft: #ffe7cf;
    --panel: #ffffff;
    --shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
    --letter-font: "Andika", "Comic Sans MS", "Chalkboard SE", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Noto Sans", "PingFang SC", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }

  /* Home */
  #home { justify-content: center; gap: 28px; }
  .polly { font-size: 7rem; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
  .big-play {
    width: 180px; height: 180px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-ink); font-size: 5rem;
    box-shadow: var(--shadow); display: grid; place-items: center; padding-left: 14px;
  }
  .big-play:active { transform: translateY(4px); box-shadow: none; }
  .stickers { font-size: 1.6rem; color: var(--muted); min-height: 2rem; text-align: center; max-width: 600px; word-break: break-all; }
  .gear {
    position: fixed; top: 12px; right: 12px; width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--card); font-size: 1.5rem;
    display: grid; place-items: center; touch-action: none;
  }
  .gear .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid var(--accent); clip-path: inset(0 0 0 0); opacity: 0; }
  .gear.holding .ring { opacity: 1; animation: fill 1.2s linear forwards; }
  @keyframes fill { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* Session */
  #session { gap: 18px; padding-top: 12px; }
  .topbar { width: 100%; max-width: 820px; display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    width: 56px; height: 56px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--card); font-size: 1.7rem; display: grid; place-items: center; flex: none;
  }
  .dots { flex: 1; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .dots span.done { background: var(--good); }
  .dots span.now { background: var(--accent); transform: scale(1.3); }
  .stage { flex: 1; width: 100%; max-width: 820px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }

  .speaker {
    width: 110px; height: 110px; border-radius: 50%; border: 0; background: var(--accent);
    color: var(--accent-ink); font-size: 3rem; box-shadow: var(--shadow);
  }
  .speaker:active { transform: translateY(4px); box-shadow: none; }
  .speaker.playing { animation: pulse 0.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; align-items: center; }

  .choice {
    min-width: 140px; min-height: 140px; padding: 10px 18px; border-radius: 28px;
    border: 4px solid var(--line); background: var(--card); box-shadow: var(--shadow);
    display: grid; place-items: center; transition: transform 0.15s, border-color 0.15s;
  }
  .choice:active { transform: translateY(4px); box-shadow: none; }
  .choice.letter { font-family: var(--letter-font); font-size: 6.5rem; line-height: 1; }
  .choice.pic { font-size: 5.5rem; line-height: 1; }
  .choice.lit { border-color: var(--accent); transform: scale(1.06); }
  .choice.right { border-color: var(--good); background: #e8f8ef; }
  .choice.hint { border-color: var(--good); animation: pulse 0.8s ease-in-out 3; }
  .choice.wrong { animation: shake 0.4s; }
  .choice.faded { opacity: 0.35; }
  @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

  .hero-letter { font-family: var(--letter-font); font-size: 13rem; line-height: 1; border: 0; background: none; padding: 0 20px; }
  .hero-pic { font-size: 7rem; line-height: 1; border: 0; background: none; }
  .with-letter { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 18px; }
  .with-letter .tag { font-family: var(--letter-font); font-size: 4.5rem; line-height: 1; }

  /* Tiles are sized in em, and the row's font shrinks when a long word would not fit.
     --w is the row's width in em, set by app.js. */
  .tiles {
    display: flex; gap: 0.125em; font-family: var(--letter-font); line-height: 1;
    font-size: min(6rem, calc((min(100vw, 820px) - 48px) / var(--w, 4)));
  }
  .tile {
    width: 1.25em; height: 1.46em; padding: 0;
    border-radius: 22px; border: 4px solid var(--line); background: var(--card); box-shadow: var(--shadow);
    display: grid; place-items: center;
  }
  .tile.wide { width: auto; padding: 0 0.15em; }
  .tile.lit { border-color: var(--accent); background: var(--soft); }
  .blend-btn { font-size: 2.4rem; padding: 10px 30px; border-radius: 999px; border: 0; background: var(--blend); color: #fff; box-shadow: var(--shadow); }
  .reveal { font-size: 6rem; min-height: 7rem; line-height: 1; }
  .judge { display: flex; gap: 16px; margin-top: 8px; }
  .judge button { font-size: 2.2rem; width: 84px; height: 64px; border-radius: 18px; border: 2px dashed var(--line); background: var(--card); }
  .parent-hint { font-size: 0.85rem; color: var(--muted); text-align: center; max-width: 520px; }

  .next {
    font-size: 3rem; width: 120px; height: 84px; border-radius: 999px; border: 0;
    background: var(--good); color: #fff; box-shadow: var(--shadow);
  }
  .drum { font-size: 5rem; width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  .drum:active { transform: scale(0.94); }
  .beats { display: flex; gap: 14px; min-height: 44px; }
  .beats span { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); animation: pop 0.25s; }
  @keyframes pop { from { transform: scale(0); } }

  .star-burst { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; font-size: 9rem; animation: burst 0.8s forwards; }
  @keyframes burst { from { transform: scale(0.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .done-stars { font-size: 5rem; }
  .missing-audio { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }

  /* Grown-up panel */
  #parent { position: fixed; inset: 0; background: rgba(40, 30, 20, 0.45); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 16px; z-index: 10; }
  .panel { background: var(--panel); width: 100%; max-width: 760px; border-radius: 18px; padding: 20px; user-select: text; -webkit-user-select: text; }
  .panel h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .panel h3 { margin: 22px 0 8px; font-size: 1.05rem; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
  .panel p, .panel li { font-size: 0.92rem; line-height: 1.45; }
  .panel .zh { color: var(--muted); }
  .panel .close { float: right; }
  .pbtn { font-size: 0.9rem; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .pbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .pbtn.danger { color: #b3261e; }
  .pbtn:disabled { opacity: 0.4; cursor: default; }
  .letter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .lchip { border: 2px solid var(--line); border-radius: 12px; padding: 6px; text-align: center; font-size: 0.75rem; color: var(--muted); }
  .lchip b { display: block; font-family: var(--letter-font); font-size: 2rem; color: var(--ink); font-weight: normal; }
  .lchip.current { border-color: var(--accent); }
  .lchip.ready { background: #e8f8ef; border-color: var(--good); }
  .lchip.locked { opacity: 0.45; }
  .suggest { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 0.92rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .rec-list { display: grid; gap: 8px; }
  .rec-list.later { margin-top: 8px; }
  .rec { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .rec .ph { font-family: var(--letter-font); font-size: 2rem; text-align: center; }
  .rec .ph.multi { font-size: 1.3rem; line-height: 1.2; }
  .rec .tips { font-size: 0.82rem; line-height: 1.35; }
  .rec .status { font-size: 0.75rem; font-weight: 600; }
  .rec .status.ok { color: var(--good); }
  .rec .status.missing { color: #b3261e; }
  .rec .btns { display: flex; gap: 6px; }
  .pbtn.recording { background: #b3261e; color: #fff; border-color: #b3261e; }
  .word-list { font-size: 0.85rem; color: var(--muted); }
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .wchip { display: flex; align-items: center; border: 1px dashed var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .wchip.ok { border: 1px solid var(--good); background: #f1fbf5; }
  .wchip.recording { border: 2px solid #b3261e; background: #fdeceb; }
  .wchip .wrec { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 7px 8px; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wchip .wmini { border: 0; border-left: 1px solid var(--line); background: none; padding: 7px 8px; font-size: 0.8rem; }
  .wchip .wmini.danger { color: #b3261e; }
  .wchip button:disabled { opacity: 0.4; cursor: default; }
  select.pbtn { padding: 6px 8px; }

  @media (max-width: 520px) {
    .choice { min-width: 110px; min-height: 110px; }
    .choice.letter { font-size: 5rem; }
    .choice.pic { font-size: 4.2rem; }
    .hero-letter { font-size: 9rem; }
    .tiles { font-size: min(4.2rem, calc((100vw - 48px) / var(--w, 4))); }
    .tile { border-radius: 16px; }
    .rec { grid-template-columns: 40px 1fr; }
    .rec .btns { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<!-- Child home screen: no text, just Polly, a big play button and stickers earned. -->
<main id="home" class="screen">
  <div class="polly" aria-hidden="true">🦜</div>
  <button id="startBtn" class="big-play" aria-label="Start">▶</button>
  <div id="stickers" class="stickers" aria-label="Stickers"></div>
</main>

<!-- Child session screen. -->
<main id="session" class="screen" hidden>
  <div class="topbar">
    <button id="quitBtn" class="icon-btn" aria-label="Stop">🏠</button>
    <div id="dots" class="dots"></div>
    <button id="replayBtn" class="icon-btn" aria-label="Hear again">🔊</button>
  </div>
  <section id="stage" class="stage"></section>
</main>

<!-- Grown-up menu: opened by holding the gear for about a second. -->
<button id="gearBtn" class="gear" aria-label="Grown-up menu (hold)"><span class="ring"></span>⚙️</button>
<div id="parent" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Grown-up menu"></div>
</div>
<div id="audioNote" class="missing-audio" hidden></div>

<script src="data/curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
